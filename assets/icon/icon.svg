<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Brand coral background (AppTheme.coral, #FF5A6E) — no transparency, no
       rounded corners; the OS applies its own mask (iOS/web). -->
